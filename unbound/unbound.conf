server:
    verbosity: 3
    interface: 0.0.0.0
    port: 53
    do-ip4: yes
    do-ip6: no
    do-udp: yes
    do-tcp: yes
    access-control: 0.0.0.0/0 allow
    root-hints: "/etc/unbound/root.hints"
# enable DNSSEC
    auto-trust-anchor-file: "/usr/share/dnssec-root/trusted-key.key"
# disable user privilege protection
    username: ""
# option to harden against unverified glue
    harden-unverified-glue: yes
    